<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pilates SaaS - Acesso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div id="auth-container">
        <!-- Formulário de Cadastro -->
        <div id="register-section">
            <h2>Cadastro de Usuário</h2>
            <form id="userForm">
                <input type="text" id="name" placeholder="Nome completo" required>
                <input type="email" id="email" placeholder="E-mail" required>
                <input type="password" id="password" placeholder="Senha" required>
                <button type="submit">Salvar Usuário</button>
            </form>
            <p style="margin-top: 15px; text-align: center;">
                Já tem uma conta? <a href="#" id="showLogin" style="color: blue; text-decoration: underline;">Faça login aqui</a>
            </p>
        </div>

        <!-- Formulário de Login (inicialmente oculto) -->
        <div id="login-section" style="display: none;">
            <h2>Entrar no Sistema</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="E-mail" required>
                <input type="password" id="loginPassword" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>
            <p style="margin-top: 15px; text-align: center;">
                Não tem conta? <a href="#" id="showRegister" style="color: blue; text-decoration: underline;">Cadastre-se</a>
            </p>
        </div>
    </div>

    <p id="feedback" style="margin-top: 15px; font-weight: bold;"></p>
</div>

<script>
    const registerSection = document.getElementById('register-section');
    const loginSection = document.getElementById('login-section');
    const feedback = document.getElementById('feedback');

    // Alternar para tela de login
    document.getElementById('showLogin').addEventListener('click', (e) => {
        e.preventDefault();
        registerSection.style.display = 'none';
        loginSection.style.display = 'block';
        feedback.innerText = '';
    });

    // Alternar para tela de cadastro
    document.getElementById('showRegister').addEventListener('click', (e) => {
        e.preventDefault();
        loginSection.style.display = 'none';
        registerSection.style.display = 'block';
        feedback.innerText = '';
    });

    // Lógica de Cadastro
    document.getElementById('userForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const userData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            const response = await fetch('/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });

            if (response.ok) {
                feedback.style.color = 'green';
                feedback.innerText = 'Usuário cadastrado com sucesso! Faça login.';
                document.getElementById('userForm').reset();
            } else {
                feedback.style.color = 'red';
                feedback.innerText = 'Erro ao cadastrar. E-mail já existe?';
            }
        } catch (error) {
            console.error('Erro:', error);
        }
    });

    // Lógica de Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const loginData = {
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
        };

        try {
            const response = await fetch('/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            });

            if (response.ok) {
                const user = await response.json();
                feedback.style.color = 'green';
                feedback.innerText = `Bem-vindo de volta, ${user.name}!`;
            } else {
                feedback.style.color = 'red';
                feedback.innerText = 'E-mail ou senha inválidos.';
            }
        } catch (error) {
            console.error('Erro:', error);
        }
    });
</script>
</body>
</html>
